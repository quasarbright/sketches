<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2048 tiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tiles.css" />
  <style>
    body { margin: 0; padding: 28px 16px 60px; background: #120f24; color: #f0ecff; font: 500 15px/1.4 Outfit, system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font: 400 1.6rem Bungee, sans-serif; color: #ffcf4d; }
    p { margin: 0 0 22px; color: #a69ed0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 18px; padding: 18px; background: #0b0918; border-radius: 20px; box-shadow: inset 0 0 0 2px #241e48; }
    figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    figcaption { font: 500 .72rem ui-monospace, monospace; color: #6d6499; }
    .tile { width: 96px; height: 96px; }
  </style>
</head>
<body>
  <main>
    <h1>2048 tiles</h1>
    <p>Every tile the game can make, 2 through 131072, drawn by the same code and CSS as the board. From 128 up they glow; past 4096 each one gets its own look: foil, molten, aurora, a galaxy, and the cosmic web.</p>
    <div class="grid" id="grid"></div>
  </main>
  <script type="module">
    import { tileColors, paintFace, tier } from "./palette.mjs";
    const grid = document.getElementById("grid");
    // ?size=240 draws them bigger, ?from=8192 skips the small ones
    const q = new URLSearchParams(location.search), size = +q.get("size") || 96, from = +q.get("from") || 2;
    grid.style.gridTemplateColumns = `repeat(auto-fill, minmax(${size + 8}px, 1fr))`;
    for (let v = from; v <= 131072; v *= 2) {
      const fig = document.createElement("figure"), box = document.createElement("div"), face = document.createElement("div");
      box.className = "tile";
      box.style.width = box.style.height = size + "px";
      face.className = "g-face";
      paintFace(face, v, size); // the same function the board uses
      box.append(face);
      const cap = document.createElement("figcaption");
      cap.textContent = `2^${Math.log2(v)} · ${tier(v) || tileColors(v)[0]}`;
      fig.append(box, cap);
      grid.append(fig);
    }
  </script>
</body>
</html>
