<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Timeline Mocks</title>
<link rel="stylesheet" href="../shared/cohesion.css" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Lato:wght@400;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style id="mock">
  .mk-tag { position: fixed; top: 8px; left: 8px; z-index: 99; font: 600 .75rem var(--font-ui); background: #f2a541; color: #1b1200; padding: 3px 8px; border-radius: 6px; }
  .mk-step-text { margin: 0; line-height: 1.45; }
  .mk-step-text .ms-label { display: inline; margin-right: 4px; }

  /* A: a vertical story */
  .mk-story { list-style: none; margin: 0; padding: 0 0 0 26px; position: relative; display: flex; flex-direction: column; gap: 18px; }
  .mk-story::before { content: ""; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
  .mk-story > li { position: relative; display: flex; flex-direction: column; gap: 8px; }
  .mk-story > li::before { content: attr(data-n); position: absolute; left: -26px; top: 0; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    font: 600 .7rem var(--font-ui); background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); }
  .mk-story h3 { margin: 0; font: 600 1rem var(--font-ui); }
  .mk-act { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
  .mk-act .ms-hint { margin: 0; }
  .mk-who { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .mk-who .ms-avatar { width: 26px; height: 26px; font-size: .8rem; }
  .mk-eye { color: #ffd88a; }
  .mk-swapgrid { display: grid; grid-template-columns: auto auto auto; align-items: center; gap: 6px 10px; justify-content: start; }
  .mk-swapgrid .ms-hint { margin: 0; font-size: .8rem; }
  .mk-story .ms-table-grid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  .mk-story .ms-table-center > .ms-cardwrap { width: 84px; }
  .mk-x { grid-row: span 2; color: #ffd88a; width: 34px; height: 64px; }

  /* B: lanes */
  .mk-lanes { position: relative; display: grid; gap: 0; align-items: center; }
  .mk-lanes .mk-h { font: 600 .7rem var(--font-ui); color: var(--muted); text-align: center; padding-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .mk-lanes .mk-rowname { font: 500 .85rem var(--font-ui); white-space: nowrap; padding-right: 6px; }
  .mk-lanes .mk-rowname.is-center { color: var(--muted); }
  .mk-cell { position: relative; height: 46px; display: grid; place-items: center; }
  .mk-cell::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; transform: translateY(-50%); background: var(--lane); opacity: .55; }
  .mk-cell.is-first::before, .mk-cell.no-in::before { left: 50%; } .mk-cell.is-last::before, .mk-cell.no-out::before { right: 50%; }
  .mk-cell.no-in.no-out::before { display: none; }
  .mk-tile { position: relative; z-index: 1; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--team); box-shadow: 0 0 0 2px var(--bg); }
  .mk-tile .ms-emblem { width: 26px; height: 26px; }
  .mk-tile.is-hot { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #ffd88a; }
  .mk-badge { position: absolute; z-index: 2; right: 2px; top: 0; width: 18px; height: 18px; border-radius: 50%; background: #ffd88a; color: #231a00; display: grid; place-items: center; }
  .mk-badge svg { width: 12px; height: 12px; }
  .mk-dot { position: relative; z-index: 1; width: 9px; height: 9px; border-radius: 50%; background: var(--lane); }
  .mk-sep { grid-column: 1 / -1; height: 1px; background: var(--border); margin: 4px 0; }
  .mk-overlay { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 0; }
  .mk-stage { padding-top: 30px; }
  .mk-mark { top: -30px !important; }
  .mk-legend { display: flex; flex-direction: column; gap: 6px; }
  .mk-legend li { display: flex; gap: 8px; align-items: baseline; }
  .mk-legend { list-style: none; margin: 0; padding: 0; }
  .mk-legend b { font: 600 .75rem var(--font-ui); color: var(--muted); min-width: 22px; }

  /* C: step through */
  .mk-scrub { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .mk-scrub button { flex: none; font: 600 .8rem var(--font-ui); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted); cursor: pointer; }
  .mk-scrub button.is-on { background: color-mix(in srgb, var(--accent) 22%, var(--panel-2)); color: var(--text); border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
  .mk-stage { position: relative; }
  .mk-stage .ms-cardwrap.is-look .ms-card, .mk-stage .ms-cardwrap.is-swap .ms-card { box-shadow: 0 0 0 3px #ffd88a, 0 6px 20px rgba(0,0,0,.4); }
  .mk-stage .ms-cardwrap.is-actor .ms-card-label { color: #ffd88a; font-weight: 600; }
  .mk-mark { position: absolute; z-index: 3; top: -8px; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 4px; background: #ffd88a; color: #231a00; font: 700 .7rem var(--font-ui); padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .mk-mark svg { width: 13px; height: 13px; }
  .mk-nav { display: flex; gap: 10px; align-items: center; }
  .mk-nav .ms-btn { flex: 1; }
  .mk-caption { min-height: 3em; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { ROLES, TEAMS, emblemSvg } from "./roles.mjs";
import * as SKIN from "./skin.mjs";
import { artSvg } from "./art.mjs";

// Reuse the game's own styles.
const html = await (await fetch("index.html")).text();
const st = document.createElement("style");
st.textContent = html.match(/<style[^>]*>([\s\S]*?)<\/style>/)[1];
document.head.prepend(st);

const ICONS = {
  arrow: `<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>`,
  swap: `<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>`,
  eye: `<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>`,
};
const icon = (n, cls = "ms-ico") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const roleColor = (role) => SKIN.ROLE_COLORS?.[role]?.card || TEAMS[ROLES[role].team].color;
function bandColor(role) {
  const set = SKIN.ROLE_COLORS?.[role]?.band; if (set) return set;
  const c = roleColor(role); if (!/^#[0-9a-f]{6}$/i.test(c)) return c;
  return "#" + [1, 3, 5].map((i) => Math.min(255, Math.round(parseInt(c.slice(i, i + 2), 16) * 1.22 + 6)).toString(16).padStart(2, "0")).join("");
}
const cardStyle = (role) => `--team:${roleColor(role)};--band:${bandColor(role)}`;
const teamMark = (role) => `<span class="ms-team-mark">${esc(TEAMS[ROLES[role].team].letter)}</span>`;
function card(role, { size = "sm" } = {}) {
  const R = ROLES[role];
  return `<div class="ms-card ms-${size}" style="${cardStyle(role)}">
    <div class="ms-card-name${R.name.length > 8 ? " is-long" : ""}${R.name.length > 10 ? " is-xlong" : ""}" style="--len:${R.name.length}">${esc(R.name)}</div>${size === "xs" ? "" : teamMark(role)}
    <div class="ms-card-art">${size === "xs" ? emblemSvg(role) : artSvg(role)}</div></div>`;
}
const wrap = (inner, cls = "", attrs = "") => `<div class="ms-cardwrap ${cls}" ${attrs}>${inner}</div>`;
function avatar(name) {
  const hues = { Mike: 195, Ana: 45, Ben: 25, Cleo: 170, Dev: 340 };
  return `<span class="ms-avatar" style="--h:${hues[name]}">${name[0]}</span>`;
}

// ---- an example game
const players = ["Mike", "Ana", "Ben", "Cleo", "Dev"];
const POS = [...players.map((p) => "p:" + p), "c:0", "c:1", "c:2"];
const posName = (k) => (k.startsWith("p:") ? k.slice(2) : `Center ${+k.slice(2) + 1}`);
const deal = { "p:Mike": "thief", "p:Ana": "seer", "p:Ben": "werewolf", "p:Cleo": "meddler", "p:Dev": "nightowl", "c:0": "werewolf", "c:1": "sleepwalker", "c:2": "villager" };
const steps = [
  { label: "Werewolves", actor: "Ben", look: ["c:2"], text: "Ben, the only wolf, looked at center card 3: the Villager." },
  { label: "Seer", actor: "Ana", look: ["p:Ben"], text: "Ana (Seer) looked at Ben's card: the Werewolf." },
  { label: "Robber", actor: "Mike", swap: ["p:Mike", "p:Ben"], look: ["p:Mike"], text: "Mike (Robber) swapped with Ben and looked at the new card: the Werewolf." },
  { label: "Troublemaker", actor: "Cleo", swap: ["p:Ana", "p:Mike"], text: "Cleo (Troublemaker) swapped Ana's Seer with Mike's Werewolf." },
  { label: "Insomniac", actor: "Dev", look: ["p:Dev"], text: "Dev (Insomniac) looked at their own card: still the Insomniac." },
];
const states = [deal];
for (const s of steps) {
  const n = { ...states.at(-1) };
  if (s.swap) [n[s.swap[0]], n[s.swap[1]]] = [n[s.swap[1]], n[s.swap[0]]];
  states.push(n);
}
const end = states.at(-1);
const R = (r) => ROLES[r].name;

const opt = new URLSearchParams(location.search).get("opt") || "A";
const page = (title, sub, body) => `<div class="mk-tag">Mock ${opt}</div>
  <main class="ms-page ms-results">
    <section class="ms-dayhead"><div class="ms-label">Morning</div><h1 class="ms-h1 ms-headline" style="color:${TEAMS.village.color}">The village wins</h1></section>
    <section class="ms-ev"><h2 class="ms-h2">${title}</h2><p class="ms-hint" style="margin:0">${sub}</p>${body}</section>
  </main>`;

function table(st, { changedFrom, hot = {} } = {}) {
  const one = (k) => {
    const ch = changedFrom && changedFrom[k] !== st[k];
    return wrap(card(st[k]) + `<div class="ms-card-label">${esc(posName(k))}</div>${ch ? `<span class="ms-tag ms-changed">changed</span>` : ""}`, hot[k] || "", `data-pos="${k}"`);
  };
  return `<div class="ms-table"><div class="ms-table-grid">${POS.filter((k) => k.startsWith("p:")).map(one).join("")}</div>
    <div class="ms-table-grid ms-table-center">${POS.filter((k) => k.startsWith("c:")).map(one).join("")}</div></div>`;
}
const chip = (role) => card(role, { size: "xs" });

// ---- A: one story, top to bottom
function mockA() {
  const items = steps.map((s, i) => {
    const before = states[i], after = states[i + 1];
    let vis = "";
    if (s.swap) {
      const [a, b] = s.swap;
      vis = `<div class="mk-swapgrid">
        <div>${chip(before[a])}<div class="ms-hint">${esc(posName(a))}</div></div>
        <svg class="mk-x" viewBox="0 0 34 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 14 C 17 14, 17 50, 31 50"/><path d="M3 50 C 17 50, 17 14, 31 14"/><path d="m26 45 5 5-5 5"/><path d="m26 9 5 5-5 5"/></svg>
        <div>${chip(after[a])}<div class="ms-hint">${esc(posName(a))} now</div></div>
        <div>${chip(before[b])}<div class="ms-hint">${esc(posName(b))}</div></div>
        <div>${chip(after[b])}<div class="ms-hint">${esc(posName(b))} now</div></div>
      </div>`;
    }
    for (const k of s.look || []) {
      vis += `<div class="mk-act"><span class="mk-who">${avatar(s.actor)}${esc(s.actor)}</span>${icon("eye", "ms-ico mk-eye")}<span class="ms-hint">${k === "p:" + s.actor ? "own card" : esc(posName(k))}</span>${chip(after[k])}</div>`;
    }
    return `<li data-n="${i + 1}"><h3><span class="ms-label">${esc(s.label)}</span></h3><p class="mk-step-text">${esc(s.text)}</p>${vis}</li>`;
  }).join("");
  return page("The Night, Step by Step", "From the deal to the morning. Gold marks what each turn touched.",
    `<ol class="mk-story">
      <li data-n="·"><h3>The deal</h3>${table(deal)}</li>
      ${items}
      <li data-n="·"><h3>When the night ended</h3>${table(end, { changedFrom: deal })}</li>
    </ol>`);
}

// ---- B: every position is a lane; columns are the deal, each turn and the end
function mockB() {
  const cols = ["Deal", ...steps.map((_, i) => String(i + 1)), "End"];
  const nC = cols.length;
  let cells = `<div></div>${cols.map((c) => `<div class="mk-h">${c}</div>`).join("")}`;
  POS.forEach((k, r) => {
    if (k === "c:0") cells += `<div class="mk-sep"></div>`;
    cells += `<div class="mk-rowname ${k.startsWith("c:") ? "is-center" : ""}">${esc(posName(k))}</div>`;
    for (let c = 0; c < nC; c++) {
      const si = Math.min(c, states.length - 1);
      const role = c === nC - 1 ? end[k] : states[si][k];
      const s = c >= 1 && c <= steps.length ? steps[c - 1] : null;
      const swapped = s?.swap?.includes(k);
      const looked = s?.look?.includes(k);
      const actor = s && k === "p:" + s.actor;
      const nxt = c + 1 <= steps.length ? steps[c] : null;
      const cut = `${swapped ? "no-in" : ""} ${nxt?.swap?.includes(k) ? "no-out" : ""}`;
      const show = c === 0 || c === nC - 1 || swapped || looked;
      cells += `<div class="mk-cell ${cut} ${c === 0 ? "is-first" : ""} ${c === nC - 1 ? "is-last" : ""}" style="--lane:${roleColor(role)}" data-r="${r}" data-c="${c}">
        ${show ? `<div class="mk-tile ${swapped || looked ? "is-hot" : ""}" style="${cardStyle(role)}" title="${esc(R(role))}">${emblemSvg(role)}</div>${looked ? `<span class="mk-badge">${icon("eye", "")}</span>` : ""}` : `<span class="mk-dot" ${actor ? `style="box-shadow:0 0 0 3px #ffd88a"` : ""}></span>`}
      </div>`;
    }
  });
  const legend = steps.map((s, i) => `<li><b>${i + 1}</b><span class="mk-step-text"><span class="ms-label">${esc(s.label)}</span> ${esc(s.text)}</span></li>`).join("");
  const roles = [...new Set(Object.values(deal))];
  const key = roles.map((r) => chip(r)).join(" ");
  return page("The Night at a Glance", "Each row is a seat; its color is the card there. Tiles show the deal, every card a turn touched, and the end. Crossing lines are swaps; gold ringed dots are who acted.",
    `<div class="mk-lanes" id="lanes" style="grid-template-columns:auto repeat(${nC}, minmax(0, 1fr))"><svg class="mk-overlay" id="ov"></svg>${cells}</div>
     <div class="ms-row" style="flex-wrap:wrap;gap:6px">${key}</div>
     <ol class="mk-legend">${legend}</ol>`);
}
function drawB() {
  const box = document.getElementById("lanes"); if (!box) return;
  const ov = document.getElementById("ov"); const b0 = box.getBoundingClientRect();
  let p = "";
  steps.forEach((s, i) => {
    if (!s.swap) return;
    const c = i + 1;
    const [ra, rb] = s.swap.map((k) => POS.indexOf(k));
    const ca = box.querySelector(`[data-r="${ra}"][data-c="${c}"]`).getBoundingClientRect();
    const cb = box.querySelector(`[data-r="${rb}"][data-c="${c}"]`).getBoundingClientRect();
    const pa = box.querySelector(`[data-r="${ra}"][data-c="${c - 1}"]`).getBoundingClientRect();
    const x0 = pa.left + pa.width / 2 - b0.left, x1 = ca.left + ca.width / 2 - b0.left;
    const ya = ca.top + ca.height / 2 - b0.top, yb = cb.top + cb.height / 2 - b0.top;
    const col = (k) => roleColor(states[i][k]);
    p += `<path d="M${x0} ${ya} C ${(x0 + x1) / 2} ${ya}, ${(x0 + x1) / 2} ${yb}, ${x1} ${yb}" stroke="${col(s.swap[0])}" stroke-width="3" fill="none" opacity=".75"/>`;
    p += `<path d="M${x0} ${yb} C ${(x0 + x1) / 2} ${yb}, ${(x0 + x1) / 2} ${ya}, ${x1} ${ya}" stroke="${col(s.swap[1])}" stroke-width="3" fill="none" opacity=".9"/>`;
  });
  ov.innerHTML = p;
}

// ---- C: one table you step through
let at = +(new URLSearchParams(location.search).get("at") ?? 0);
function mockC() {
  const n = steps.length + 1;
  const labels = ["Deal", ...steps.map((s) => s.label), "End"];
  const s = at >= 1 && at <= steps.length ? steps[at - 1] : null;
  const st = at === 0 ? deal : at > steps.length ? end : states[at];   // the table right after this turn
  const hot = {};
  if (s) {
    for (const k of s.look || []) hot[k] = "is-look";
    for (const k of s.swap || []) hot[k] = "is-swap";
    hot["p:" + s.actor] = (hot["p:" + s.actor] || "") + " is-actor";
  }
  const caption = at === 0 ? "How the cards were dealt." : at > steps.length ? "Everyone's card when the night ended. Gold tags mark the ones that moved." : s.text;
  return page("The Night", "Step through the night from the deal to the end.",
    `<div class="mk-scrub">${labels.map((l, i) => `<button class="${i === at ? "is-on" : ""}" data-at="${i}">${i >= 1 && i <= steps.length ? i + " " : ""}${esc(l)}</button>`).join("")}</div>
     <p class="mk-step-text mk-caption">${s ? `<span class="ms-label">${esc(s.label)}</span> ` : ""}${esc(caption)}</p>
     <div class="mk-stage" id="stage">${table(st, { hot, changedFrom: at > steps.length ? deal : null })}<svg class="mk-overlay" id="ov"></svg></div>
     <div class="mk-nav"><button class="ms-btn" data-at="${Math.max(0, at - 1)}" ${at === 0 ? "disabled" : ""}>Back</button><button class="ms-btn ms-primary" data-at="${Math.min(n, at + 1)}" ${at === n ? "disabled" : ""}>Next</button></div>`);
}
function drawC() {
  const stage = document.getElementById("stage"); if (!stage) return;
  const s = at >= 1 && at <= steps.length ? steps[at - 1] : null;
  const b0 = stage.getBoundingClientRect();
  for (const el of stage.querySelectorAll(".is-look, .is-swap")) {
    const k = el.dataset.pos;
    const looker = s.look?.includes(k);
    el.insertAdjacentHTML("afterbegin", `<span class="mk-mark">${icon(looker ? "eye" : "swap", "")}${looker ? (k === "p:" + s.actor ? `${s.actor} looked` : `${s.actor} looked`) : "swapped"}</span>`);
  }
  let p = "";
  if (s?.swap) {
    const [a, b] = s.swap.map((k) => stage.querySelector(`[data-pos="${k}"] .ms-card`).getBoundingClientRect());
    const ax = a.left + a.width / 2 - b0.left, bx = b.left + b.width / 2 - b0.left, y = Math.min(a.top, b.top) - b0.top - 14;
    const ya = a.top - b0.top - 12, yb = b.top - b0.top - 12;
    const mid = (ax + bx) / 2, top = y - 12;
    p += `<path d="M${ax} ${ya} Q ${mid} ${top}, ${bx} ${yb}" stroke="#ffd88a" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/>`;
    p += `<path d="M${bx - 7} ${yb - 7} L ${bx} ${yb} L ${bx + 1} ${yb - 10}" stroke="#ffd88a" stroke-width="2.5" fill="none"/>`;
    p += `<path d="M${ax + 7} ${ya - 7} L ${ax} ${ya} L ${ax - 1} ${ya - 10}" stroke="#ffd88a" stroke-width="2.5" fill="none"/>`;
  }
  document.getElementById("ov").innerHTML = p;
}

function render() {
  document.getElementById("root").innerHTML = opt === "A" ? mockA() : opt === "B" ? mockB() : mockC();
  requestAnimationFrame(() => { drawB(); drawC(); });
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-at]"); if (b) { at = +b.dataset.at; render(); } });
addEventListener("resize", () => { drawB(); drawC(); });
render();
window.__ready = true;
</script>
</body>
</html>
